name: turntable
description: turntable (Turntable Labs) is a consumer social-music company originally surfaced as a portfolio
  company of slow-ventures and union-square-ventures. The original Turntable.fm social listening service
  shut down in 2013 and its domain no longer resolves. The lineage lives on at Turntable Labs, which
  operates two consumer music products - Hangout (a social music-streaming and group-chat app at hangout.fm /
  hang.fm) and Turntable (a create-share-and-vibe GenAI music experience). No public API, developer portal,
  SDKs, or API documentation are published for any of these products - this is a consumer application, not an
  API provider. Enrichment probes (DNS, HTTP, site fetch) confirmed no developer surface as of 2026-07-21.
